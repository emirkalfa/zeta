name: Release

# v* etiketi itildiğinde: sürümü doğrular, testleri çalıştırır, üç platform için
# paketleri üretip dener ve GitHub Release'i CHANGELOG notlarıyla yayınlar.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Sürümü doğrula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Etiket, VERSION ve CHANGELOG uyumu
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: Yayınla
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Dosyaları topla
        run: |
          mkdir release
          cp artifacts/zeta-*/* release/
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -l

      - name: GitHub Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=""
          # 2.1.0-rc.1 gibi ön sürümler "latest" olarak işaretlenmez
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "ZETA ${GITHUB_REF_NAME#v}" \
            --notes-file artifacts/release-notes/release-notes.md \
            --verify-tag $flags
